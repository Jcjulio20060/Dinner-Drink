services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://${HOST}:${PORT}
    depends_on:
      - backend
  
  backend:
    build: ./backend
    ports:
      - "${PORT}:3000"
    environment:
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_DB=${MONGO_DB}
      - MONGO_HOST=db
      - MONGO_PORT=27017
      - MONGO_AUTH_SOURCE=${MONGO_AUTH_SOURCE}
      - MONGO_USE_AUTH=${MONGO_USE_AUTH}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.io/library/mongo:latest
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DB}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongo-data: